services:
  # PostgreSQL Database (lighter alternative to full YugabyteDB for development)
  postgres:
    image: postgres:15
    container_name: yugastore-postgres
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./resources:/scripts
    networks:
      - yugastore-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Database initialization
  db-init:
    image: postgres:15
    container_name: yugastore-db-init
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./resources:/scripts
    command: >
      sh -c "
        echo 'Initializing database schema...' &&
        PGPASSWORD=postgres psql -h postgres -p 5432 -U postgres -d postgres -f /scripts/schema.sql &&
        PGPASSWORD=postgres psql -h postgres -p 5432 -U postgres -d postgres -f /scripts/auth-schema.sql &&
        echo 'Database initialization completed!'
      "
    networks:
      - yugastore-network

  # Eureka Service Discovery
  eureka-server:
    build:
      context: ./eureka-server-local
      dockerfile: Dockerfile.simple
    container_name: yugastore-eureka
    ports:
      - "8761:8761"
    environment:
      - SERVER_PORT=8761
    networks:
      - yugastore-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Login Microservice (Authentication & RBAC)
  login-service:
    build:
      context: ./login-microservice
      dockerfile: Dockerfile.simple
    container_name: yugastore-login
    ports:
      - "8085:8085"
    environment:
      - SERVER_PORT=8085
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/postgres
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - JWT_SECRET=YugaStore_JWT_Secret_Key_2026_Change_In_Production
      - JWT_EXPIRATION=86400
    depends_on:
      eureka-server:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    networks:
      - yugastore-network
    restart: on-failure

  # Products Microservice
  products-service:
    build:
      context: ./products-microservice
      dockerfile: Dockerfile.simple
    container_name: yugastore-products
    ports:
      - "8082:8082"
    environment:
      - SERVER_PORT=8082
      - CRONOS_YUGABYTE_HOSTNAME=postgres
      - CRONOS_YUGABYTE_PORT=5432
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://eureka-server:8761/eureka/
    depends_on:
      eureka-server:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    networks:
      - yugastore-network
    restart: on-failure

volumes:
  postgres_data:

networks:
  yugastore-network:
    driver: bridge